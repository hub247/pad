<script>
const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],L=['agudo','ambrose','angel','atmospheric','bethel','cinematic','elevation','gateway','hillsong','motion','new','rhodes','shimmer','stoutcreek','warm','worship'],$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let p=JSON.parse(localStorage.getItem('pad-v10')||'{}'),lib=p.lib||'worship',note=p.note||'C',pad=null,metro=null;const save=()=>localStorage.setItem('pad-v10',JSON.stringify(p)),title=x=>x[0].toUpperCase()+x.slice(1),pu=(l,n)=>`audio/pad/${encodeURIComponent(l)}/${encodeURIComponent(l+'-'+n)}.mp3`,mu=()=>`audio/metronomo/0030bpm_4x4.mp3`;function fade(a,to,s,done){clearInterval(a.f);let from=a.volume,st=performance.now();a.f=setInterval(()=>{let q=Math.min(1,(performance.now()-st)/Math.max(50,s*1000));a.volume=from+(to-from)*q;if(q>=1){clearInterval(a.f);done&&done()}},35)}function notify(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),2500)}
function renderPads(){let h=N.map(n=>`<button class="pad ${n===note?'sel':''} ${pad&&pad.note===n?'on':''}" data-n="${n}">${n}</button>`).join('');$$('.mainPads,.mobilePads,.stagePads').forEach(x=>x.innerHTML=h);$$('.pad').forEach(x=>x.onclick=()=>{let n=x.dataset.n;if(pad&&pad.note===n)return stopPad();note=n;p.note=n;save();playPad(n)})}async function playPad(n){let old=pad,a=new Audio(pu(lib,n));a.loop=true;a.volume=0;a.note=n;try{await a.play()}catch{return notify('Não foi possível iniciar o áudio')}pad=a;fade(a,1,+p.fi||4);if(old)fade(old,0,+p.fo||4,()=>old.pause());ui()}function stopPad(){if(!pad)return;let a=pad;pad=null;ui();fade(a,0,+p.fo||4,()=>{a.pause();a.currentTime=0})}async function toggleMetro(){if(metro){metro.pause();metro=null;return ui()}let a=new Audio(mu());a.loop=true;a.playbackRate=(+p.bpm||30)/30;try{await a.play()}catch{return notify('Não foi possível iniciar o metrônomo')}metro=a;ui()}function stopAll(){stopPad();if(metro){metro.pause();metro=null}ui()}function setBpm(v){p.bpm=Math.max(30,Math.min(240,+v||30));save();if(metro)metro.playbackRate=p.bpm/30;$('#stageBpm').textContent=$('#stageSlider').value=$('#stageInput').value=p.bpm;$$('.metro').forEach(x=>x.innerHTML=metroHtml())}function metroHtml(){return `<h3>Metrônomo</h3><div class="bpm">${p.bpm||30} <small>BPM</small></div><input class="mSlider" type="range" min="30" max="240" value="${p.bpm||30}"><button class="btn primary mBtn">${metro?'■ Parar':'▶ Tocar metrônomo'}</button>`}function bindMetro(){$$('.mSlider').forEach(x=>x.oninput=e=>setBpm(e.target.value));$$('.mBtn').forEach(x=>x.onclick=toggleMetro)}function ui(){$$('.libName').forEach(x=>x.textContent=title(lib));$$('.stopPad').forEach(x=>x.disabled=!pad);$$('.stopAll').forEach(x=>x.disabled=!pad&&!metro);$('#bottom').classList.toggle('ready',!pad&&!metro);$('#bottomText').textContent=pad?`${title(lib)} • ${pad.note}`:metro?`Metrônomo • ${p.bpm||30} BPM`:'Pronto';$('#deskNow').textContent=pad?`${title(lib)} • ${pad.note}`:'Nenhum pad ativo';$('#stageMetroBtn').textContent=metro?'■ Parar metrônomo':'▶ Metrônomo';renderPads();$$('.metro').forEach(x=>x.innerHTML=metroHtml());bindMetro()}
function libs(){$('#libgrid').innerHTML=L.map(x=>`<button class="soft" data-l="${x}">${title(x)}</button>`).join('');$$('[data-l]').forEach(x=>x.onclick=()=>{lib=x.dataset.l;p.lib=lib;save();$('#libs').classList.add('hidden');ui()})}$$('.openLib').forEach(x=>x.onclick=()=>{$('#libs').classList.remove('hidden');libs()});$$('.closeLib').forEach(x=>x.onclick=()=>$('#libs').classList.add('hidden'));$$('.stageOpen').forEach(x=>x.onclick=()=>$('#stage').classList.remove('hidden'));$$('.closeStage').forEach(x=>x.onclick=()=>$('#stage').classList.add('hidden'));$$('.stopPad').forEach(x=>x.onclick=stopPad);$$('.stopAll').forEach(x=>x.onclick=stopAll);$$('.tab').forEach(x=>x.onclick=()=>{$$('.tab').forEach(y=>y.classList.remove('on'));x.classList.add('on');$$('.view').forEach(y=>y.classList.remove('active'));$('#v-'+x.dataset.v).classList.add('active')});$('#stageMetroBtn').onclick=toggleMetro;$('#stageSlider').oninput=e=>setBpm(e.target.value);$('#stageInput').onchange=e=>setBpm(e.target.value);$('#sm').onclick=()=>setBpm((p.bpm||30)-1);$('#sp').onclick=()=>setBpm((p.bpm||30)+1);$$('[data-b]').forEach(x=>x.onclick=()=>setBpm(x.dataset.b));$('#fi').oninput=e=>{p.fi=e.target.value;$('#fiT').textContent=e.target.value+'s';save()};$('#fo').oninput=e=>{p.fo=e.target.value;$('#foT').textContent=e.target.value+'s';save()};async function battery(){if(navigator.getBattery){let b=await navigator.getBattery();$('#battery').textContent='🔋 '+Math.round(b.level*100)+'%'}}function init(){p.bpm??=30;p.fi??=4;p.fo??=4;$('#fi').value=p.fi;$('#fo').value=p.fo;$('#fiT').textContent=p.fi+'s';$('#foT').textContent=p.fo+'s';setBpm(p.bpm);libs();battery();ui()}if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));init();
